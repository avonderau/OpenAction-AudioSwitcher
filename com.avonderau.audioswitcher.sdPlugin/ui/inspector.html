<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Switcher</title>
<link rel="stylesheet" href="inspector.css">
</head>
<body>
<section>
  <h2 id="heading">Devices</h2>
  <p id="status" class="status">Checking…</p>
  <ul id="devices" class="devices"></ul>
  <p class="hint">Tick one device to switch to it, or several to cycle through them in this order. The label is what the key shows; leave it empty to use the device name.</p>
  <button id="refresh" type="button">Refresh list</button>
</section>
<script src="inspector.js"></script>
</body>
</html>
